<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이용 안내 - EVCar</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/common/common.css}">
<link rel="stylesheet" th:href="@{/css/mypage/memberAccessDenied.css}">
</head>
<body class="ev-access-page-body">
    <div th:replace="~{layout/header :: header}"></div>

    <main class="ev-access-page">
        <div class="ev-access-card">
            <div class="ev-access-card__icon">⚠️</div>

            <p class="ev-access-card__label">이용 안내</p>

            <h1 class="ev-access-card__title"
                th:text="${message != null ? message : '요청하신 페이지를 이용할 수 없습니다.'}">
                요청하신 페이지를 이용할 수 없습니다.
            </h1>

            <p class="ev-access-card__text">
                탈퇴한 회원은 마이페이지 및 회원 전용 기능을 이용할 수 없습니다.
            </p>

            <p class="ev-access-card__subtext">
                서비스를 다시 이용하시려면 새로 회원가입을 진행해주세요.
                로그인 상태를 다시 확인한 뒤 이용 가능한 메뉴로 이동하실 수 있습니다.
            </p>

            <div class="ev-access-card__actions">
                <a th:href="@{/main}" class="btn btn-primary">메인으로</a>
                <a th:href="@{/login}" class="btn btn-outline-primary">로그인</a>
                <a th:href="@{/signup}" class="btn btn-outline-primary">회원가입</a>
            </div>
        </div>
    </main>

    <div th:replace="~{layout/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/common/footer.js}"></script>
</body>
</html>
